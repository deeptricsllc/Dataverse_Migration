services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dvm
      POSTGRES_PASSWORD: dvm
      POSTGRES_DB: dataverse_migration
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - '5432:5432'
    volumes:
      - dvm-postgres:/var/lib/postgresql/data

volumes:
  dvm-postgres:
